<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence space</title>
<style>
@font-face { font-family: "Inter"; src: url("fonts/inter-latin.woff2") format("woff2"); font-weight: 400 800; font-style: normal; font-display: swap; }
html, body { margin: 0; height: 100%; background: #0b1020; color: #c9d2e6; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
#plot { position: absolute; inset: 0; }
#reset { position: absolute; top: 0.6rem; right: 0.6rem; z-index: 5; padding: 0.35rem 0.9rem; font: inherit; font-size: 0.85rem; color: #eef1f8; background: rgba(24, 35, 63, 0.85); border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 999px; cursor: pointer; }
#reset:hover { background: #18233f; }
#reset:focus-visible { outline: 3px solid #e8743b; outline-offset: 2px; }
#legend { position: absolute; left: 0.8rem; bottom: 0.6rem; z-index: 5; display: flex; flex-wrap: wrap; gap: 0.2rem 1rem; max-width: calc(100% - 1.6rem); margin: 0; padding: 0; list-style: none; font-size: 0.78rem; color: #97a3bf; pointer-events: none; }
#legend i { display: inline-block; width: 0.6rem; height: 0.6rem; margin-right: 0.35rem; border-radius: 50%; vertical-align: -0.05rem; }
#msg { position: absolute; inset: 0; margin: 0; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; color: #97a3bf; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="plot"></div>
<button type="button" id="reset" hidden>Reset view</button>
<ul id="legend" hidden></ul>
<p id="msg">Loading...</p>
<script src="vendor/plotly-gl3d-2.35.2.min.js"></script>
<script src="evidence3d.js" charset="utf-8"></script>
</body>
</html>
